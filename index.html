<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="每日一则中国古典公有领域名句——安静阅读。" />
  <meta name="theme-color" content="#f4efe6" />
  <title>每日古典篇章</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page">
    <header class="header">
      <p class="eyebrow">每日古典篇章</p>
      <time id="date" class="date" datetime="">—</time>
    </header>

    <main class="main" aria-live="polite">
      <blockquote class="quote">
        <p id="quote-text" class="quote-text">正在加载今日篇章…</p>
        <footer class="attribution">
          <cite id="quote-book" class="book"></cite>
          <span id="quote-author" class="author"></span>
        </footer>
      </blockquote>
      <p id="pd-note" class="pd-note"></p>
    </main>

    <footer class="site-footer">
      <p>本站仅选用中国古典小说中已进入公有领域的原文短章（如《红楼梦》《西游记》《水浒传》《三国演义》《儒林外史》《聊斋志异》等），不含受版权保护的现代作品或外国著作之现代译文。以上说明仅供参考，不构成法律意见。</p>
      <p class="credit">安静阅读 · 按亚洲/上海（UTC+8）日历日轮换</p>
    </footer>
  </div>

  <script>
    (function () {
      const TZ = "Asia/Shanghai";

      function shanghaiYmd(d) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: TZ,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(d);
        const get = (t) => parts.find((p) => p.type === t).value;
        return { y: +get("year"), m: +get("month"), day: +get("day") };
      }

      function dayOfYearShanghai(d) {
        const { y, m, day } = shanghaiYmd(d);
        const utcNoon = Date.UTC(y, m - 1, day, 12, 0, 0);
        const start = Date.UTC(y, 0, 1, 12, 0, 0);
        return Math.floor((utcNoon - start) / 86400000) + 1;
      }

      function formatDate(d) {
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: TZ,
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long",
        }).format(d);
      }

      function isoDate(d) {
        const { y, m, day } = shanghaiYmd(d);
        return y + "-" + String(m).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      }

      fetch("quotes.json")
        .then(function (r) {
          if (!r.ok) throw new Error("load failed");
          return r.json();
        })
        .then(function (quotes) {
          if (!Array.isArray(quotes) || quotes.length === 0) {
            throw new Error("empty");
          }
          var now = new Date();
          var index = (dayOfYearShanghai(now) - 1) % quotes.length;
          var q = quotes[index];

          document.getElementById("date").textContent = formatDate(now);
          document.getElementById("date").setAttribute("datetime", isoDate(now));
          document.getElementById("quote-text").textContent = q.text;
          document.getElementById("quote-book").textContent = "《" + q.book + "》";
          document.getElementById("quote-author").textContent = q.author;
          document.getElementById("pd-note").textContent = q.note || "公有领域";
          document.title = "每日古典篇章 · " + q.author;
        })
        .catch(function () {
          document.getElementById("quote-text").textContent =
            "抱歉，今日篇章暂时无法加载，请稍后再试。";
        });
    })();
  </script>
</body>
</html>
